# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# ONE STEP, and it is the whole of what this repository ships: tests, then a native image pushed to
# qits-artifacts under $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-docs:$QITS_CI_SHA — the
# tag convention qits-platform-deployments pulls by.
#
# `docker: true` is the declared opt-in that mounts the host socket for this step, because building
# and pushing an image is what it is for. It is root-equivalent on the host and is declared here
# where a diff shows it — see qits-ci's AGENTS.md on the untrusted-input posture.
#
# THE CLIENT PRELUDE IS PRESENT, the same one qits-gateway's pipeline carries: this step inits the
# `qits-spa-docs` submodule and runs `npm ci && npm run build` before the image build. The @qits
# scope is reachable from qits-net and from no address a docker build has, so the bundle must be
# built HERE and arrive in the build context.
#
# The image is built by docker/Dockerfile's Mandrel builder stage rather than by this container:
# node-docker-base carries no GraalVM, and the builder stage brings its own native-image.
steps:
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      set -eu

      # THE CLIENT IS BUILT HERE, and this is the only place it can be. src/main/webui is
      # qits-spa-docs and it depends on @qits/ui-components, which lives only on the
      # platform's own npm registry — reachable from this container on qits-net and from NO address
      # a docker build has. So the bundle is built here and the image build packages it; see
      # docker/Dockerfile's header.
      #
      # The clone is --depth 50 and does not recurse, so the submodule is initialised by hand — and
      # from THIS platform's git host rather than from the .gitmodules URL, which names GitHub.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-spa-docs"
      git -c submodule.qits-spa-docs.url="$frontend_url" \
        submodule update --init src/main/webui

      cd src/main/webui
      # THE LOCKFILE, RETARGETED. npm pins an absolute `resolved` URL per package and this lockfile
      # was generated on the deployment host, so every entry names a localhost port — an address
      # that does not exist in this container. `npm ci` fetches by that URL and never asks the
      # configured registry, so without this swap the install dies on connection refused. The byte
      # plane is TWO SERVICES since the split — qits-platform-mirror holds the npmjs pull-through
      # cache, qits-artifacts hosts the @qits scope — so no single origin serves both and the PATH
      # is what tells them apart: an entry under the hosted registry's own pathname
      # ($QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/) gets the hosted origin and everything else
      # gets the proxy's. sed applies -e in sequence, so the broad swap runs first and the narrow
      # path-anchored one corrects the @qits entries after it. The integrity hashes are what make
      # replacing only the ORIGIN safe.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file: this repo COMMITS an .npmrc naming localhost:8081 for @qits and
      # localhost:8082 for npmjs (right for a developer on the host), and npm ranks a project .npmrc
      # ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble would be written and silently ignored.
      # npm_config_* outranks both.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund
      npm run build
      cd -

      # NO `./mvnw` HERE, and that is the platform's convention rather than an omission: this image
      # carries node and a docker client and NO JDK, so a maven line in a step script fails with
      # "JAVA_HOME is not defined correctly" — measured, on this pipeline's first run. Every Java
      # service on this platform builds inside its Dockerfile's Mandrel stage, which brings its own,
      # and the step's whole job is to drive docker.
      #
      # The suite therefore runs in that stage too (docker/Dockerfile does NOT pass -DskipTests):
      # it needs no docker and no running qits-artifacts, so it costs seconds and a broken route
      # grammar fails the build before the native compile rather than after a deploy. It DOES now
      # need the platform's Maven repository, to resolve the two test-scope userflow jars — which is
      # what the two docker flags below are for; the userflow story itself is not run here (failsafe
      # binds after `package`), only compiled.
      #
      # THE TWO DOCKER FLAGS, and this build acquired them with the userflows rollout. This file
      # used to say at length that nothing here wanted the platform's own network, because the pom
      # declared no qits dependency and Maven resolved from Central. That stopped being true: the
      # pom now carries `qits-userflows` and `qits-service-mock` in TEST scope for
      # DocsReadingBootstrapIT, both published to the platform's own Maven repository and available
      # from nowhere else — and the builder stage deliberately runs the suite, so it resolves the
      # test classpath and needs an address that answers.
      #
      #   --network host        NOT a custom network: buildkit refuses those on a build, and the
      #                         platform targets buildkit because a swarm cannot assume the legacy
      #                         builder. Host networking is buildkit-supported and reaches the
      #                         registry's host-published address. (This line once passed
      #                         `--network qits-net`; that had to go either way.)
      #   --build-arg           names that address, derived from the same injected env the image tag
      #                         uses, so no address is stated here. The Dockerfile turns it into
      #                         -Dqits.maven.repository.url.
      #
      # Quinoa is still no part of it: its install and build commands are replaced by `--version`,
      # so no npm registry is read, and the `localhost:8082` base images are pulled by the DAEMON on
      # the host rather than by the build's network namespace.
      #
      # The two --secret flags are the fleet's shape for a credential inside a build: the launcher
      # injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and a Dockerfile that needs it
      # mounts it on one RUN — never a --build-arg, which is recorded in a pullable image's history.
      # The Dockerfile's mvnw RUN now mounts both as the `qits-maven-network` server's credentials,
      # and they stay inert until the registry answers 401: Maven sends a password only when
      # challenged, and a missing env source is NOT an error (measured on buildx v0.36.1).
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-docs:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.
