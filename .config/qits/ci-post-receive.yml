# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# ONE STEP, and it is the whole of what this repository ships: tests, then a native image pushed to
# qits-platform-artifacts under $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-platform-docs:$QITS_CI_SHA — the
# tag convention qits-platform-deployments pulls by.
#
# `docker: true` is the declared opt-in that mounts the host socket for this step, because building
# and pushing an image is what it is for. It is root-equivalent on the host and is declared here
# where a diff shows it — see qits-ci's AGENTS.md on the untrusted-input posture.
#
# NOTE WHAT IS ABSENT compared with qits-gateway's pipeline, which this otherwise mirrors: there is
# no submodule init and no `npm ci && npm run build` prelude, because this service carries no webui
# yet. `qits-platform-spa-docs` is the index UI and is not wired in. The day it is, this step grows
# the same prelude for the same reason — the @qits scope is reachable from qits-net and from no
# address a docker build has, so the bundle must be built HERE and arrive in the build context.
#
# The image is built by docker/Dockerfile's Mandrel builder stage rather than by this container:
# node-docker-base carries no GraalVM, and the builder stage brings its own native-image.
steps:
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      set -eu

      # THE CLIENT IS BUILT HERE, and this is the only place it can be. src/main/webui is
      # qits-platform-spa-docs and it depends on @qits/ui-components, which lives only on the
      # platform's own npm registry — reachable from this container on qits-net and from NO address
      # a docker build has. So the bundle is built here and the image build packages it; see
      # docker/Dockerfile's header.
      #
      # The clone is --depth 50 and does not recurse, so the submodule is initialised by hand — and
      # from THIS platform's git host rather than from the .gitmodules URL, which names GitHub.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-platform-spa-docs"
      git -c submodule.qits-platform-spa-docs.url="$frontend_url" \
        submodule update --init src/main/webui

      cd src/main/webui
      # npm pins a full resolved URL per package and this lockfile was generated on the deployment
      # host, so every entry names localhost:8081 — an address that does not exist in this
      # container. `npm ci` fetches by that URL and never asks the configured registry, so without
      # this swap the install dies on connection refused. The paths are identical on both
      # addresses; the integrity hashes are what make replacing only the ORIGIN safe.
      npm_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      sed -i -E "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_origin#" package-lock.json

      # ENVIRONMENT, not a file: this repo COMMITS an .npmrc naming localhost:8081 (right for a
      # developer on the host), and npm ranks a project .npmrc ABOVE ~/.npmrc — so a `cat >
      # ~/.npmrc` preamble would be written and silently ignored. npm_config_* outranks both.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund
      npm run build
      cd -

      # NO `./mvnw` HERE, and that is the platform's convention rather than an omission: this image
      # carries node and a docker client and NO JDK, so a maven line in a step script fails with
      # "JAVA_HOME is not defined correctly" — measured, on this pipeline's first run. Every Java
      # service on this platform builds inside its Dockerfile's Mandrel stage, which brings its own,
      # and the step's whole job is to drive docker.
      #
      # The suite therefore runs in that stage too (docker/Dockerfile does NOT pass -DskipTests):
      # it needs no docker, no network and no qits-platform-artifacts, so it costs seconds and a broken route
      # grammar fails the build before the native compile rather than after a deploy.
      #
      # `--network qits-net` is what lets the builder stage reach the platform's own registries, the
      # same flag qits-platform-artifacts' pipeline passes for the same reason.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-platform-docs:$QITS_CI_SHA"
      docker build --network qits-net -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      docker rmi "$ref" || true
