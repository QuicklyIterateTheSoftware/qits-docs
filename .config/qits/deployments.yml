# How qits-platform-deployments deploys this repo. It reads this file from the git host at the
# built sha, so the answer travels with the commit rather than living in the deployer's database.
#
# PLATFORM, not environment, and the reason is what this service reads rather than what it is.
# There is ONE docs repository in qits-artifacts, holding what the whole platform has published; a
# reader per environment would be two front doors onto one store, disagreeing about nothing useful.
# Holding no state of its own is what makes that a free choice rather than a constraint — there is
# no per-environment data here to keep apart.
#
# `platform` is the canonical spelling; `singleton` is the accepted alias older files still carry.
deployment_target: platform

# The default would be /platform-docs/q/health/ready, derived from the name with the qits- prefix
# dropped — which is exactly right here. It is spelled anyway because the segment is spelled in
# three other places (DocsPaths.BASE, quarkus.http.non-application-root-path, and
# QitsService.PLATFORM_DOCS in the gateway) and a reader chasing a failing health gate should find
# it here too rather than have to know the derivation.
health_path: /platform-docs/q/health/ready
