# THE QA PIPELINE — this repository's only pipeline besides the release recipe, and it runs for
# RELEASE REQUESTS ALONE. It replaces ci-event-build.yml and ci-event-userflows.yml, both deleted in
# the commit that added this file. The reference template with the full argument is qits-ci's
# docs/ci-event-release-request.yml.
#
# Per-push CI is retired platform-wide: nothing builds a branch, because cd deploys what a RELEASE
# published rather than what a push built. qits-projects keeps, per open release request, a backing
# branch `release/<id>` — an octopus merge of the request's sources, refolded whenever the set
# changes — and publishes `ReleaseRequestChanged` on every successful re-fold. That branch is
# written by qits-githost's merge primitive, which fires no post-receive and therefore publishes no
# `SCMPublishCommit`: without this event the fold exists and nothing builds it.
#
# DECIDE AT MAIN, BUILD AT THE FOLD. The file is discovered, parsed and selected at this
# repository's `main` head; only the run's branch and sha come from the payload. So a release
# request cannot alter the CI that gates it by folding in a commit that edits this file.
#
# ONE FILE, TWO HALVES, and "a red verify must not cost the image" still holds — bought with
# ORDERING plus PER-STEP CLASSIFICATION rather than with two files that cannot share a verdict. The
# gating build is FIRST; the userflow half declares `gating: false`, which still fails the run and
# shows red but does not hold the fold for qits-projects' build gate. Keep it LAST: everything after
# a failing step is SKIPPED.
#
# THE SHA IMAGE IS GONE. The old build step ended in `docker push
# $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-docs:$QITS_CI_SHA`, the per-push coordinate cd keyed
# on; a fold's merged sha is not a coordinate anything could deploy. The image is still BUILT here,
# and on THIS repository that is the heaviest gate there is: docker/Dockerfile deliberately runs the
# suite in its builder stage (no -DskipTests), so the unit gate lives inside the image build and
# dropping it would have left the fold proved by nothing but the stories. The local tag is what
# replaces the registry coordinate; the CalVer one is ci-event-release.yml's, which is untouched.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit, no tag and no image — nothing
# the fold is made of changes, so it cannot re-trigger itself. The bundle lands in the very store
# this service reads, which is self-referential and not circular: the PUT goes to qits-artifacts,
# and this pipeline listens for a release request, not for a publish. Publish-if-absent: events
# redeliver and docs versions are immutable, so 409 is success.
event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since the identity
  # cutover, so a name match on repoId is not dependable. The event echoes the public name; a rename
  # updates this line in the same campaign. `suppressCi` went with the push event that carried it —
  # a release request is not a push and `-o qits.no-ci` has nothing to say about one.
  - repoName: { exact: qits-docs-service }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  # --- the GATING half: build the fold ------------------------------------------------------------
  # ci-event-build.yml's step, minus the push.
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      set -eu
      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha — the fold is already
      # checked out, so nothing here fetches or switches refs.
      #
      # THE CLIENT IS BUILT HERE, and this is the only place it can be. src/main/webui is
      # qits-docs-frontend and it depends on @qits/ui-components, which lives only on the
      # platform's own npm registry — reachable from this container on qits-net and from NO address
      # a docker build has. So the bundle is built here and the image build packages it; see
      # docker/Dockerfile's header.
      #
      # The clone is --depth 50 and does not recurse, so the submodule is initialised by hand — and
      # from THIS platform's git host rather than from the .gitmodules URL, which names GitHub.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-docs-frontend"
      git -c submodule.qits-docs-frontend.url="$frontend_url" \
        submodule update --init src/main/webui
      cd src/main/webui
      # THE LOCKFILE, RETARGETED. npm pins an absolute `resolved` URL per package and this lockfile
      # was generated on the deployment host, so every entry names a localhost port — an address
      # that does not exist in this container. `npm ci` fetches by that URL and never asks the
      # configured registry, so without this swap the install dies on connection refused. The byte
      # plane is TWO SERVICES since the split — qits-platform-mirror holds the npmjs pull-through
      # cache, qits-artifacts hosts the @qits scope — so no single origin serves both and the PATH
      # is what tells them apart: an entry under the hosted registry's own pathname
      # ($QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/) gets the hosted origin and everything else
      # gets the proxy's. sed applies -e in sequence, so the broad swap runs first and the narrow
      # path-anchored one corrects the @qits entries after it. The integrity hashes are what make
      # replacing only the ORIGIN safe.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json
      # ENVIRONMENT, not a file: this repo COMMITS an .npmrc naming localhost:8081 for @qits and
      # localhost:8082 for npmjs (right for a developer on the host), and npm ranks a project .npmrc
      # ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble would be written and silently ignored.
      # npm_config_* outranks both.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund
      npm run build
      cd -
      # NO `./mvnw` HERE, and that is the platform's convention rather than an omission: this image
      # carries node and a docker client and NO JDK, so a maven line in a step script fails with
      # "JAVA_HOME is not defined correctly" — measured, on this pipeline's first run. Every Java
      # service on this platform builds inside its Dockerfile's Mandrel stage, which brings its own,
      # and the step's whole job is to drive docker.
      #
      # The suite therefore runs in that stage too (docker/Dockerfile does NOT pass -DskipTests):
      # it needs no docker and no running qits-artifacts, so it costs seconds and a broken route
      # grammar fails the build before the native compile rather than after a deploy. THAT IS WHY
      # THIS STEP REMAINS THE GATE even with nothing to push: the unit suite is inside the image
      # build. It DOES need the platform's Maven repository, to resolve the test-scope userflow jar
      # — which is what the two docker flags below are for; the userflow stories themselves are not
      # run here (failsafe binds after `package`), only compiled.
      #
      # THE TWO DOCKER FLAGS, and this build acquired them with the userflows rollout:
      #
      #   --network host        NOT a custom network: buildkit refuses those on a build, and the
      #                         platform targets buildkit because a swarm cannot assume the legacy
      #                         builder. Host networking is buildkit-supported and reaches the
      #                         registry's host-published address.
      #   --build-arg           names that address, derived from the same injected env, so no
      #                         address is stated here. The Dockerfile turns it into
      #                         -Dqits.maven.repository.url.
      #
      # Quinoa is still no part of it: its install and build commands are replaced by `--version`,
      # so no npm registry is read, and the `localhost:8082` base images are pulled by the DAEMON on
      # the host rather than by the build's network namespace.
      #
      # The two --secret flags are the fleet's shape for a credential inside a build: the launcher
      # injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, and a Dockerfile that needs it
      # mounts it on one RUN — never a --build-arg, which is recorded in a pullable image's history.
      # The Dockerfile's mvnw RUN mounts both as the `qits-maven-network` server's credentials,
      # and they stay inert until the registry answers 401: Maven sends a password only when
      # challenged, and a missing env source is NOT an error (measured on buildx v0.36.1).
      #
      # THE TAG IS LOCAL AND NOTHING IS PUSHED. The registry-qualified `:$QITS_CI_SHA` coordinate was
      # the per-push publication and it is retired with the push path; `docker: true` stays for the
      # daemon socket the build needs and for the pull auth the mirror-fronted base images need.
      ref="qits-docs:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --build-arg QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_CENTRAL_MIRROR_URL:-}" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving.

  # --- the NON-GATING half: verify the stories, and publish what the run observed -----------------
  # ci-event-userflows.yml's step, unchanged but for `gating: false`, which is the whole of what that
  # separate file was.
  #
  # `mvn verify` at the fold — which regenerates target/userstories/ through the whole story
  # catalogue — and the reports published as one docs bundle, site @userflows/qits-docs, version =
  # the merged sha, branch riding as artifacts metadata for discovery.
  #
  # ONE STEP, BECAUSE STEPS SHARE NOTHING. Every step container clones the repository for itself, so
  # the gating step above cannot hand this one anything: the verify and the publish stay together.
  #
  # `user: build`, and NOT a switch inside the script. In the sibling files that line is the initdb
  # workaround — zonky's embedded postgres refuses to run as root — and NONE of that applies here:
  # this service has no database, the pom names no zonky binaries, and the stories' whole far side is
  # an in-process stub on loopback (stories/support/StoryStore, which does write under target/: an
  # access log and the armed-fault files, both inside the build directory the step already owns).
  # It is spelled anyway because it is the fleet's posture for a step that only builds: passwd-backed
  # non-root (maven-base carries uid 1001), cap-drop=ALL, no chown and no su available to undo it.
  # Nothing this step runs wants any of those.
  #
  # Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is silently
  # ignored and npm still runs): the client is the gating step's business, where the qits-docs-frontend
  # submodule is initialised and its lockfile origins are swapped, and none of that ritual belongs
  # here — the stories assert nothing about the SPA. It is also what keeps this step from needing the
  # submodule at all: the daemon's clone does not recurse, so src/main/webui arrives EMPTY and
  # Quinoa would fail the build on exactly that. The packaged fast-jar failsafe boots is otherwise
  # exactly what ships.
  #
  # NO -Dit.test, AND THAT IS DELIBERATE RATHER THAN AN OMISSION — read this before adding a story.
  # In every sibling repository the userflow step names its story classes on the command line, and a
  # class missing from that list silently never runs. Here the pom opts the whole module's ITs back in
  # (`skipITs` false, the qits-githost shape) and failsafe runs EVERY *IT in the module, so a new
  # story class is run for existing rather than for being listed. That is affordable because there is
  # no heavyweight sibling to drag in: no docker gate, no real git, no spawned database, no browser —
  # six browserless stories against one launched fast-jar, beside one loopback stub. If an expensive
  # IT is ever added here, this line stops being true and this file has to grow the list the siblings
  # carry.
  #
  # ONE @TestProfile (stories/support/StoryProfile) for all six, so failsafe launches ONE process; the
  # story classes are ordered by UserflowClassOrderer (registered from src/test/resources/
  # application.properties as the junit.quarkus.orderer.secondary-orderer), which is what puts
  # DocsReadingBootstrapIT first — the class whose edge count is the claim that the boot dialled
  # nothing.
  #
  # The surefire half of this run is the same five-second pair of plain-JUnit classes a clone already
  # runs.
  - image: qits/build-images/maven-base:latest
    user: build
    gating: false
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker. This repository's pom
      # gained its `qits-maven` repository WITH the userflows rollout — qits-userflows is the only
      # qits dependency it has (qits-service-mock was dropped when the far side became a purpose-
      # built stand-in of qits-artifacts' docs plane; see the pom's note).
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false
      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. SINGLE-MODULE repository, so the path is target/userstories and
      # not the service/target/… every sibling's file names.
      tar -czf userstories.tgz -C target/userstories .
      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the merged sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-docs" \
        "$QITS_DOCS_URL/@userflows/qits-docs/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-docs@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-docs@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
