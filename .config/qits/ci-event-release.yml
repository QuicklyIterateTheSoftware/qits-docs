# The release pipeline: this repository reacts to its OWN release and pushes the image under the
# released VERSION. qits-events' file, adapted to this repository's build — see that repository for
# the long form of each rule; the short form of the ones that bite:
#
# - THE SELECTION NAMING THIS REPOSITORY IS NOT A LOOP. `SCMRelease` says only "source control has
#   this version" and qits-projects' Auto Release publishes it — SCMRelease and not SCMPublishTag,
#   because the git host's tag primitive fires no post-receive and announces nothing; nothing in
#   this file publishes it. The event
#   that could loop is SoftwareRelease, and this file neither listens for it nor publishes it.
# - THE VERSION TAG IS THE ONLY COORDINATE NOW. The `:$QITS_CI_SHA` push that rode the per-push
#   pipeline went with per-push CI itself — the QA pipeline builds a fold and publishes no image —
#   and qits-platform-deployments deploys the VERSION. So this push is the whole contract with it.
# - `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything, so
#   it cannot see what the step pushed; it announces on the strength of the line below. One entry,
#   because this pipeline pushes one image and this repository publishes no jar.
# - THE NAME IS UNQUALIFIED ON PURPOSE — the registry is one service under several addresses
#   ($QITS_BUILD_REGISTRY as the platform builder resolves it, $QITS_REGISTRY as the host daemon
#   does), and an OCI reference cannot carry a path prefix. The reader supplies its own host,
#   exactly as the push below composes one from environment.
# - THE BUILD BELOW IS THE QA PIPELINE'S, AND THE TWO MUST STAY MATCHED — byte for byte in every
#   buildctl argument, because the platform builder's cache is shared and a matched build is what
#   makes a release following a green fold a stack of cache hits rather than a second native compile
#   plus a second run of the suite. ci-event-release-request.yml inherited that step when per-push CI
#   retired, and it is where the client prelude, the lockfile origin swap, the `npm_config_*`
#   environment and the Maven repository build-arg are explained at length; this one carries the
#   short form and points there rather than keeping a second copy of the reasoning to drift.
# - THE BUILD RUNS ON THE PLATFORM'S OWN BUILDKITD, NOT THE HOST DAEMON. qits-buildkit-plan.md in
#   the wrapper is the migration; `build: true` below is the declaration that gets this step
#   $BUILDKIT_HOST, $QITS_BUILD_REGISTRY and the commissioned credential, and gets it no socket.
#   `--network host` is gone with nothing in its place: a RUN runs on qits-net, so every address a
#   build dials is the in-network one.
# - THIS FILE IS INERT UNTIL an SCMRelease for this repository exists, and it lands first on
#   purpose: the bus is at-most-once with no catch-up and no replay, so a trigger file must be in
#   place before the event it selects. The other order loses a release and looks like a train that
#   quietly did not roll.
event: SCMRelease
when:
  - repository: { exact: qits-docs-service }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: docker, name: qits/qits-docs }
steps:
    # node-docker-base, the image the QA pipeline already uses: node, npm and git for half one,
    # buildctl for half two — and node is also what reads the event payload, which is JSON.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this an early failure would be
      # swallowed by the next command's exit code — and a green release run is what makes qits-ci
      # announce the artifact, so it has to mean the image really was built and pushed. -u makes an
      # unset injected variable stop the step rather than let a ref be composed out of empty strings.
      set -eu

      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch (qits.ci.buildkit.enabled=false spells
      # off as empty-never-absent). Either way this recipe must fail here, naming the cause, rather
      # than fall back to a socket this step no longer holds — the silent fallback is exactly what
      # the migration exists to remove.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection.
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      # The version reaches a `sed` s### expression below, and `#` is that expression's own
      # delimiter — a version carrying one closes it, and GNU sed's `e` command then runs a shell.
      # Refused rather than quoted: a version here is a calver or a semver, and nothing legitimate
      # needs a character outside this set.
      case "$version" in
        ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/qits-docs:$version"

      # THE TAG IS THE CHECKOUT TARGET, and it is the only reason this run needs one. An
      # event-triggered run is cloned at the head of main, which is where the release commit is
      # *now* — a later push moves that, and the tag does not, so a busy main cannot make this
      # pipeline ship a different tree than the one that was released. The clone is shallow and
      # carries no tags, hence the explicit refspec; the URL rather than `origin` because every
      # address a step needs arrives as environment. `checkout --detach` peels the annotated tag to
      # its commit — and it is what makes the submodule fetch below land on the qits-docs-frontend
      # gitlink the release recorded rather than on main's.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # --- half one: the bundle -----------------------------------------------------------------
      # The daemon's clone is shallow and does not recurse, so src/main/webui arrives as an empty
      # directory and the image build fails on it. The submodule is initialised from THIS
      # platform's git host rather than from the .gitmodules URL, which names GitHub.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-docs-frontend"
      git -c submodule.qits-docs-frontend.url="$frontend_url" \
        submodule update --init src/main/webui

      cd src/main/webui
      # TWO SERVICES since the byte-plane split, so the swap reads the PATH: an entry under the
      # hosted registry's own pathname ($QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/) gets the
      # hosted origin and everything else gets the proxy's, and the broad expression has to run
      # before the narrow one. ci-event-release-request.yml carries the full reasoning.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      npm run build
      cd -

      # --- half two: the image ------------------------------------------------------------------
      # THE MAVEN BUILD-ARG, the same one ci-event-release-request.yml explains at length: the pom
      # carries `qits-userflows` in TEST scope for the userflow story catalogue, published only to
      # the platform's own Maven repository, and the builder stage runs the suite — so it resolves
      # the test classpath and needs an address that answers. That address is now the IN-NETWORK one,
      # $QITS_MAVEN_REGISTRY_URL: `--network host` is gone with nothing in its place, because a `RUN`
      # executes in the platform builder's own namespace on qits-net. Central rides the mirror's
      # in-network route for the same reason; empty deactivates the settings profile and Central is
      # resolved directly, as it always did. Quinoa is still no part of it (its commands are replaced
      # by `--version`), and the base images are resolved by the BUILDER, whose registry config
      # rewrites the committed edge-vhost spellings to the platform aliases.
      #
      # The two --secret flags are the fleet's shape for a credential inside a build; the launcher
      # injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET, written to files under
      # umask 077 outside the clone (so neither can enter the build context) and handed over as
      # `src=`. FILE form on both sides, never the `env=` mount form — that one couples the recipe to
      # whichever dockerfile frontend the builder picks. The Dockerfile's mvnw RUN reads both as the
      # `qits-maven-network` server's credentials, and they stay inert until the registry answers
      # 401 — Maven sends a password only when challenged.
      umask 077
      printf '%s' "$QITS_COMMISSIONED_CLIENT_ID" > /tmp/qits-client-id
      printf '%s' "$QITS_COMMISSIONED_CLIENT_SECRET" > /tmp/qits-client-secret

      # `push=true` IS THE PUBLISH: the image goes from the builder straight to the registry and
      # never enters a local image store — which retires the old `docker rmi` note outright, since it
      # described a race in a store this pipeline no longer touches. $QITS_BUILD_REGISTRY is the
      # registry as the BUILDER resolves it; $QITS_REGISTRY stays the host daemon's view and is not
      # dialled here. ci-event-release-request.yml carries the same build-args and secrets; keep them
      # matched.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-docs:$version"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"

      # --- the SBOM -----------------------------------------------------------------------------
      # THE DOCUMENT GOES UP AFTER THE PUSH AND BEFORE THIS STEP EXITS GREEN. qits-ci announces
      # `SoftwareRelease` only for a green run, so ordering is the whole guarantee: no consumer is
      # ever told about a version whose bill of materials is missing. A failed PUT fails the release
      # ON PURPOSE — the store being down is not a reason to announce a version nobody can audit.
      # Only THIS pipeline uploads one: the QA pipeline publishes no image and announces no release,
      # so it owes no document.
      #
      # The second `buildctl build` reaches the Dockerfile's `sbom` stage — a `FROM scratch` holding
      # only this project's CycloneDX document, exported with `type=local` instead of pushed.
      # Build-args and secrets are BYTE-IDENTICAL to the image build above, which is what makes every
      # layer a cache hit in the same builder and this export seconds; a drift between the two
      # invocations costs a full rebuild — native compile AND the suite, since this is the repository
      # whose builder stage runs it — not a wrong document.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom
      # The SBOM store is a sibling path of the npm registry inside the qits-artifacts deployment,
      # so its root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias a STEP container can
      # reach. NOT from $QITS_REGISTRY: that is the host daemon's view of the registry, and inside
      # this container it answers curl with an instant connection refusal (measured twice, while the
      # pushes through the daemon succeeded; the edge name 401s a sessionless write besides). Nor
      # $QITS_BUILD_REGISTRY, which is the address the BUILDER resolves — this PUT is the step's own
      # call, not the build's. The path names the
      # DECLARED artifact identity verbatim: `artifacts:` above says `{type: docker, name:
      # qits/qits-docs}`, and (packageType, packageName, version) is how the SoftwareRelease
      # consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/qits-docs/-/$version"
