# Test-mode configuration for qits-docs' suite.
#
# THERE IS ALMOST NOTHING HERE, and that is this service's shape rather than an omission: it holds
# no state, so there is no datasource to point somewhere else and no data directory to redirect
# into target/. The two @QuarkusTest-less unit tests (DocsPathsTest, DocsUpstreamParseTest) read no
# configuration at all, and the story catalogue hands the LAUNCHED process everything it needs
# through one shared @TestProfile (stories/support/StoryProfile) — a packaged process takes its
# configuration as -D arguments and reads none of this file.

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application isn't torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution.
#
# It is load-bearing now that there are six story classes sharing one profile. The orderer sorts by
# fully-qualified class name inside the topological constraints @UserflowPrecondition and
# @UserflowRunsAfter declare, which is what puts DocsReadingBootstrapIT first — the class that owns
# the boot, and whose edge count is the claim that the boot dialled nothing. Without it they would
# run in JUnit's own order and that claim would land in whichever story happened to drain first.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer
